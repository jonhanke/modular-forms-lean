    note: "Built on Mathlib at commit 1b1ccf4 (the commit Tau Ceti 4908b03 pins). docs/results/comparison.md says what each headline adds to Mathlib master (df6966d0d, 2026-11-07)."
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: "builds-on"
    note: >-
      A Lake dependency at commit 4908b03 (built from source): Fuchsian groups and the compactified modular curves as
      compact Riemann surfaces, the j-function, Hecke operators and newforms at level N, function fields over finite
      fields and their genus, elliptic-curve schemes and the fine moduli variety Y_1(N). Tau Ceti also has the
      Kronecker-Weber theorem and the addition theorem for the Weierstrass function, which are proved here too but
      are not headlines. docs/results/comparison.md compares each headline with Tau Ceti main (686d0d7f, 2026-11-07; 71ce0a33,
      2026-11-14, for the headlines new in 0.3.1;
      a5f657a8, 2026-11-12, for the class number one theorem: Tau Ceti proves that the nine fields have class number
      one and the classification for discriminants above -51; the Diophantine and numerical steps of Heegner's proof
      in this library are ported from Tau Ceti).
