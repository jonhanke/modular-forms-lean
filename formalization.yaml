# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "modular-forms-lean (ModularFormsKB): modular functions and modular forms"
  description: >-
    A Lean 4 + Mathlib + Tau Ceti formalization of two texts on modular forms, item by item: J. S. Milne's
    Modular Functions and Modular Forms (version 1.31) and T. Miyake's Modular Forms, with dimension bounds for
    modular forms on Gamma_0(N) and Gamma_1(N). Principal results: Weil's Riemann hypothesis for curves over finite
    fields (every genus); Kronecker's modular equation for every level N (C(X_0(N)) = C(j, j_N), the modular
    polynomial in Z[X, Y], symmetric, with Kronecker's congruence); the integrality of singular moduli; Abel's
    theorem and the field of elliptic functions for complex tori; the moduli of elliptic curves and of elliptic
    curves with a cyclic subgroup of order N over an algebraically closed field; Hecke's theorem and Weil's converse
    theorem; the genus of X(N) for N = 2, 3, 4, 5. Since 0.2.0 the central results of Shimura's Elementary Dirichlet
    Series and Modular Forms, Iwaniec's Topics in Classical Automorphic Forms and Andrianov and Zhuravlev's Modular
    Forms and Hecke Operators are stated in Lean (statement maps), with first proofs: a half-range formula for
    L(k, chi), twisted multiplicativity and the second moment of Kloosterman sums, and the convergence of Siegel theta
    series. Release 0.3.0 adds the first conditional theorem, of the form (named inputs) -> statement: the class
    number one theorem of Heegner (1952) and Stark (1967), that the imaginary quadratic fields of class number one
    are exactly Q(sqrt(-d)) for d in {1, 2, 3, 7, 11, 19, 43, 67, 163}, proved from eight named classical inputs
    (Weber's class invariants and the theory of binary quadratic forms), each a field of a Lean Prop structure with
    its source. Release 0.3.0 also adds Waldspurger's theorems on the Fourier coefficients of half-integral weight
    forms and the Shimura lift: unconditionally, the combinatorics of Waldspurger's admissible sign patterns and of
    the fibre dimension, Kohnen's plus space as a sign pattern, Gross's weight 3/2 form and Brandt matrices for
    p = 11, and congruent numbers (n is congruent iff y^2 = x^3 - n^2 x has a rational point with y != 0, explicit
    triangles); conditionally on named inputs (Waldspurger 1981 and 1991, Kohnen 1985, Gross 1987, Tunnell 1983,
    Coates-Wiles 1977), consequences such as nonnegativity of central values and that 1, 3 and 11 are not congruent;
    and, conditional on the weak Birch and Swinnerton-Dyer conjecture (a conjecture), Tunnell's criterion as an
    equivalence. Release 0.3.1 adds, for Milne, the little Picard theorem, Proposition 12.21 (the class group of an
    imaginary quadratic order acting on the j-invariants with complex multiplication, over every algebraically closed
    field of characteristic zero), Proposition 11.5 (Betti, l-adic and tangent representations of an elliptic curve
    over C) and the conductor exponent 2 at additive primes p != 2, 3; for Miyake, Theorem 4.5.9 (the Hecke ring of
    Gamma_0(N) is a polynomial ring) and Theorem 4.5.4 (2) (T(n) and T*(n) adjoint for every n); and historical
    theorems of Jacobi (the differential equation of modular equations, the Fourier series of Theta and H),
    Ramanujan (his differential equations for P, Q, R), Weber (theta functions as eta times his functions f,
    conditional on the Jacobi triple product) and Kronecker (the transformation law of Ser_rho for rho >= 2). Each item of the books is mapped to its Lean declaration and status in docs/results/books/, which also
    credits the results proved here that Mathlib, Tau Ceti or the Stacks Project formalization (Axiom) also prove.
  authors:
    - "Jonathan Hanke"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jonathan Hanke"

