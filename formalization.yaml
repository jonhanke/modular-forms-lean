    relationship: "related"
    note: "Independent (different Mathlib); both have the modular polynomial and X_0(N); see the overlap section of docs/results/comparison.md."

status:
  scope: >-
    Release 0.3.1. Formalized (the 63 statements of the Challenge_<book>.lean files, proved in the
    Solution_<book>.lean files):
    Milne 13 (Theorem 11.4, Theorem 6.1, Corollary 12.16, Proposition 3.1, Theorem 3.8, Proposition 3.11, Theorems 8.4
    and 8.6, Example 2.23; new in 0.3.1: Remark 2.25, Proposition 12.21, Proposition 11.5, the geometric conductor
    on p. 111), Miyake 6 (Theorems 4.3.6, 4.3.8 and 4.3.15, the last in two parts; new in 0.3.1: Theorems 4.5.9
    and 4.5.4 (2)), Shimura 1
    (Theorem 4.14 (i)), Iwaniec 2 ((4.12), (4.23)), Andrianov-Zhuravlev 1 (Chapter 1, Proposition 1.3), and the
    class number one theorem in two forms, conditional (HeegnerStark 2: each takes the named inputs
    WeberHeegnerStarkInputs, and the second also QuadraticDiscriminantInput, as hypotheses), Waldspurger 24
    (15 unconditional; 9 conditional on the named inputs WaldspurgerSquareClass, KohnenSquarefree,
    WaldspurgerCoefficients, WaldspurgerFibreDimension or GrossRatio) and CongruentNumbers 9 (4 unconditional; 3
    conditional on TunnellFormula and CoatesWiles; 2 conditional in addition on WeakBSD, the weak Birch and
    Swinnerton-Dyer conjecture), and Historical 5 (new in 0.3.1: Jacobi 2, Ramanujan 1, Kronecker 1, unconditional;
    Weber 1, conditional on the named input JacobiTripleProduct). The book maps
    give the status of every item of Milne and Miyake; the statement maps give the status of the central results of
    Shimura, Iwaniec and Andrianov-Zhuravlev, and of the papers on Waldspurger's theorems and the historical papers, that are stated in Lean. Some library files state
    named results of the books without proof (named statements); no unconditional headline depends on them.
  sorry_count: 0
  sorry_in_definitions: 0
  # No custom axioms; the standard axioms used (checked by scripts/check_axioms.lean and lake comparator):
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5", "Claude Sonnet 5.5", "Claude Haiku 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code orchestrating parallel agents, each in its own git branch, with Lean kernel builds (lake build)
        as the check and pull requests merged into the main branch; human direction throughout.
      prompting_notes: >-
        Human-chosen books and results; agents worked item by item from coverage tables of each book, with
        written notes passed between sessions. Cited results that are not proved are named Lean structures, never assumed
        silently; a kernel-level audit decides which are proved.
  notes: >-
    Jonathan Hanke designed and directed the project; the Lean code was written almost entirely by Claude Opus 5.5,
    with a share by Claude Sonnet 5.5, in October and November 2026 (the paraphrases of Miyake's items in the book
    map were first drafted by Claude Haiku 5.5). All proofs are checked by the Lean kernel; the headline statements
    are collected in the Challenge_<book>.lean files for human review.

fidelity:
  divergences: >-
    (1) Where the library states a result as a named structure, the challenge files unfold the structure into its
    field. (2) Weil's theorem is stated for function fields of one variable over a finite field (places, their
    degrees and the genus), not for curves: the points over the extension of degree n are counted as the sum over
    d dividing n of d times the number of places of degree d. (3) Theorems 8.4 and 8.6 are stated over an
    algebraically closed field (Milne states 8.4 over a perfect field through his Remark 8.3, and 8.6 also describes
    the solution over Q, which is not formalized); varieties are modelled as schemes over the field. (4) Miyake's
    conditions on q-expansions (4.3.7) are stated as polynomial growth of the coefficients. (5) Values at poles
    and other junk values follow Lean conventions; statements about elliptic functions hold off a discrete set
    where the book says so implicitly. (6) Literature locators marked [unverified] have not been checked against
    the sources; the book maps' one-line statements are paraphrases. (7) The class number one theorem is
    conditional: its named inputs (Weber's sections 87 to 94, Dirichlet and Dedekind) are hypotheses, not proved;
    two of them are weaker than Weber's statements (Theorem VI with 3 not dividing m; Theorems I and VI only at
    sqrt(-m)), which makes the theorem stronger. Weber's section numbers are those of the 1891 edition. (8) The
    Waldspurger results: the local packets are not constructed (local data are parameters); the named inputs are
    stated for coefficient sequences, entire continuations and abstract local data, not for objects constructed in
    the library; Kohnen's Petersson quotient is an unspecified positive constant; WaldspurgerSquareClass is restricted
    to quadratic characters and n prime to 4N; Gross's forms and Brandt matrices (p = 11 only) are entered
    explicitly; L(E_n, 1) is an abstract function (Mathlib has no L-functions of elliptic curves); one result is
    conditional on a conjecture (WeakBSD). (9) New in 0.3.1: Milne's Proposition 12.21 is stated (as in the
    library's corrected named statement) as a map Pic(O) x Ell(O) -> Ell(O) compatible with a-isogenies whose orbit
    maps are bijective; the action laws are not stated. Proposition 11.5 models H_1(E, Z) and the tangent space
    through the complex uniformization. The conductor is the one of Tate's algorithm (Tau Ceti); Ogg's formula is not
    formalized. Miyake's T*(n) is defined by (4.5.16). Jacobi's equation is proved for any two solutions of
    Legendre's equation (K, K' are not constructed); his Theta and H are Mathlib's theta series. Weber's formulas
    assume the Jacobi triple product (JacobiTripleProduct). Kronecker's law is proved for rho >= 2 only. See the
    README, Known restrictions.

review:
  status: "not yet reviewed: the 63 headline statements of the Challenge_<book>.lean files and the definitions they use have not yet been reviewed by a human"
  reviewers: []
  notes: >-
    The headline statements and the definitions they use have not yet been reviewed by a human; that review is
    planned. The rest of the library has not been reviewed by a human, and there has been no external review. Lean
    checks the proofs; lake comparator checks, one book at a time, that each Solution_<book>.lean proves exactly the
    statements of its Challenge_<book>.lean using only the standard axioms.

