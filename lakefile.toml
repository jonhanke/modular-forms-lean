name = "modular_forms_lean"
version = "0.5.0"
defaultTargets = ["ModularFormsKB", "Challenge_Milne", "Solution_Milne", "Challenge_MilneArithmetic", "Solution_MilneArithmetic", "Challenge_Miyake", "Solution_Miyake", "Challenge_Shimura", "Solution_Shimura", "Challenge_Iwaniec", "Solution_Iwaniec", "Challenge_AndrianovZhuravlev", "Solution_AndrianovZhuravlev", "Challenge_HeegnerStark", "Solution_HeegnerStark", "Challenge_Waldspurger", "Solution_Waldspurger", "Challenge_CongruentNumbers", "Solution_CongruentNumbers", "Challenge_Historical", "Solution_Historical", "Challenge_RankinSelberg", "Solution_RankinSelberg", "Challenge_EllipticCurves", "Solution_EllipticCurves", "Challenge_ThetaGenus", "Solution_ThetaGenus", "Challenge_KohnenPlusSpace", "Solution_KohnenPlusSpace", "MapNameDeps"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Tau Ceti: Fuchsian groups, the compactified modular curves as Riemann surfaces, Hecke operators and newforms at
# level N, function fields. Built from source (no prebuilt cache).
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "1ff53249699b7c424afd3a2df742800406435ec5"

# Mathlib last so that its dependency versions take precedence; rev = Tau Ceti's lake-manifest.json.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "e8ba86fa9744dd8d90f48c1752bc735f61a4ca81"

[[lean_lib]]
name = "ModularFormsKB"

