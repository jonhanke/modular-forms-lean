name = "modular_forms_lean"
version = "0.2.0"
defaultTargets = ["ModularFormsKB", "Challenge_Milne", "Solution_Milne", "Challenge_Miyake", "Solution_Miyake", "Challenge_Shimura", "Solution_Shimura", "Challenge_Iwaniec", "Solution_Iwaniec", "Challenge_AndrianovZhuravlev", "Solution_AndrianovZhuravlev"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Tau Ceti: Fuchsian groups, the compactified modular curves as Riemann surfaces, Hecke operators and newforms at
# level N, function fields. Built from source (no prebuilt cache).
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti.git"
rev = "4908b0344e1be5f7e9e5af7f7e640464843a2c84"

# Mathlib last so that its dependency versions take precedence; rev = Tau Ceti's lake-manifest.json.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

[[lean_lib]]
name = "ModularFormsKB"

[[lean_lib]]
name = "Challenge_Milne"
roots = ["Challenge_Milne"]

[[lean_lib]]
name = "Solution_Milne"
roots = ["Solution_Milne"]

[[lean_lib]]
name = "Challenge_Miyake"
roots = ["Challenge_Miyake"]

[[lean_lib]]
name = "Solution_Miyake"
roots = ["Solution_Miyake"]

[[lean_lib]]
name = "Challenge_Shimura"
roots = ["Challenge_Shimura"]

[[lean_lib]]
name = "Solution_Shimura"
roots = ["Solution_Shimura"]

[[lean_lib]]
name = "Challenge_Iwaniec"
roots = ["Challenge_Iwaniec"]

[[lean_lib]]
name = "Solution_Iwaniec"
roots = ["Solution_Iwaniec"]

[[lean_lib]]
name = "Challenge_AndrianovZhuravlev"
roots = ["Challenge_AndrianovZhuravlev"]

[[lean_lib]]
name = "Solution_AndrianovZhuravlev"
roots = ["Solution_AndrianovZhuravlev"]
